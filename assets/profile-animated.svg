<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="1" stop-color="#020605"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#39ff88" stroke-opacity=".045"/>
    </pattern>
    <style>
      .mono{font-family:Consolas,Monaco,monospace}
      .g{fill:#4dff91}
      .dim{fill:#79a98b}
      .white{fill:#d8ffe5}
      .line{stroke:#4dff91}
    </style>
  </defs>

  <rect width="900" height="430" rx="18" fill="url(#bg)"/>
  <rect width="900" height="430" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="428" rx="18" fill="none" stroke="#35d978" stroke-opacity=".35"/>

  <!-- terminal chrome -->
  <rect x="22" y="20" width="856" height="42" rx="10" fill="#0b1711" stroke="#244b34"/>
  <circle cx="45" cy="41" r="6" fill="#ff5f56"/>
  <circle cx="65" cy="41" r="6" fill="#ffbd2e"/>
  <circle cx="85" cy="41" r="6" fill="#27c93f"/>
  <text x="110" y="46" class="mono dim" font-size="14">mvr@github:~</text>
  <text x="850" y="46" class="mono dim" font-size="13" text-anchor="end">CYBER_PROFILE // ONLINE</text>

  <!-- title -->
  <text x="42" y="105" class="mono g" font-size="30" font-weight="700" filter="url(#glow)">VIMAL RAJ M</text>
  <text x="42" y="130" class="mono white" font-size="15">CSE • CYBERSECURITY • BUILDER</text>

  <!-- animated command -->
  <text x="42" y="166" class="mono dim" font-size="14">mvr@github:~$</text>
  <text x="153" y="166" class="mono g" font-size="14">
    whoami
    <animate attributeName="opacity" values="0;1;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="42" y="191" class="mono white" font-size="14">→ Third-year CSE student @ Sri Shakthi Institute</text>
  <text x="42" y="214" class="mono white" font-size="14">→ Cybersecurity • Coimbatore, Tamil Nadu 🇮🇳</text>

  <!-- left skill panel -->
  <rect x="32" y="240" width="405" height="158" rx="12" fill="#07130c" stroke="#1c4c2e"/>
  <text x="50" y="266" class="mono g" font-size="14">skills.json</text>

  <text x="50" y="291" class="mono white" font-size="12">Python</text>
  <rect x="145" y="281" width="245" height="11" rx="5" fill="#12261a"/>
  <rect x="145" y="281" width="184" height="11" rx="5" fill="#4dff91">
    <animate attributeName="width" from="0" to="184" dur="1.2s" fill="freeze"/>
  </rect><text x="400" y="291" class="mono dim" font-size="11">75%</text>

  <text x="50" y="316" class="mono white" font-size="12">Java</text>
  <rect x="145" y="306" width="245" height="11" rx="5" fill="#12261a"/>
  <rect x="145" y="306" width="147" height="11" rx="5" fill="#4dff91">
    <animate attributeName="width" from="0" to="147" dur="1.2s" begin=".15s" fill="freeze"/>
  </rect><text x="400" y="316" class="mono dim" font-size="11">60%</text>

  <text x="50" y="341" class="mono white" font-size="12">Flutter/Dart</text>
  <rect x="145" y="331" width="245" height="11" rx="5" fill="#12261a"/>
  <rect x="145" y="331" width="159" height="11" rx="5" fill="#4dff91">
    <animate attributeName="width" from="0" to="159" dur="1.2s" begin=".3s" fill="freeze"/>
  </rect><text x="400" y="341" class="mono dim" font-size="11">65%</text>

  <text x="50" y="366" class="mono white" font-size="12">SQL</text>
  <rect x="145" y="356" width="245" height="11" rx="5" fill="#12261a"/>
  <rect x="145" y="356" width="135" height="11" rx="5" fill="#4dff91">
    <animate attributeName="width" from="0" to="135" dur="1.2s" begin=".45s" fill="freeze"/>
  </rect><text x="400" y="366" class="mono dim" font-size="11">55%</text>

  <!-- right projects panel -->
  <rect x="455" y="240" width="413" height="158" rx="12" fill="#07130c" stroke="#1c4c2e"/>
  <text x="473" y="266" class="mono g" font-size="14">./projects</text>

  <g class="mono" font-size="12">
    <text x="473" y="292" class="dim">01</text>
    <text x="500" y="292" class="white">BLE-SOS-Mesh-App</text>
    <text x="500" y="310" class="dim">offline emergency mesh</text>

    <text x="473" y="335" class="dim">02</text>
    <text x="500" y="335" class="white">Decentralized-Vote</text>
    <text x="500" y="353" class="dim">tamper-proof voting dApp</text>

    <text x="473" y="378" class="dim">03</text>
    <text x="500" y="378" class="white">Pwd-Checker</text>
    <text x="500" y="396" class="dim">password strength analyser</text>
  </g>

  <!-- scan line -->
  <rect x="25" y="70" width="850" height="2" fill="#4dff91" opacity=".12">
    <animate attributeName="y" values="70;420;70" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- blinking cursor -->
  <rect x="42" y="411" width="8" height="15" class="g">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="57" y="424" class="mono dim" font-size="12">mvr@github:~$</text>
</svg>