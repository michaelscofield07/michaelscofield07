<!-- dark overlay gradually clears after binary intro (kept repeating) -->
<rect x="35" y="72" width="930" height="405" rx="12" fill="#000" opacity=".93">
  <animate attributeName="opacity" values=".93;.93;.93;0" keyTimes="0;.45;.55;1" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- Content begins after 5 seconds -->
<g class="mono">
  <!-- NAME typing -->
  <text x="500" y="205" text-anchor="middle" class="green" font-size="44" font-weight="700" filter="url(#glow)">
    VIMAL RAJ M
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.50;.62" dur="8s" fill="freeze"/>
  </text>

  <!-- blinking cursor / typing feel -->
  <rect x="500" y="225" width="0" height="2" class="green">
    <animate attributeName="width" values="0;390;390" keyTimes="0;.60;1" dur="8s" fill="freeze"/>
    <animate attributeName="x" values="500;695;695" keyTimes="0;.60;1" dur="8s" fill="freeze"/>
  </rect>

  <!-- CSE CYBERSECURITY -->
  <text x="500" y="260" text-anchor="middle" class="white" font-size="21">
    CSE  //  CYBERSECURITY
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.64;.75" dur="8s" fill="freeze"/>
  </text>

  <!-- profile views -->
  <text x="500" y="310" text-anchor="middle" class="dim" font-size="15">
    PROFILE VIEWS  //  <tspan class="white">VISITORS</tspan>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.77;.86" dur="8s" fill="freeze"/>
  </text>

  <!-- core skills -->
  <text x="500" y="355" text-anchor="middle" class="dim" font-size="13">
    CORE SKILLS
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.87;.92" dur="8s" fill="freeze"/>
  </text>
  <text x="500" y="388" text-anchor="middle" class="green" font-size="17" letter-spacing="4">
    PYTHON   JAVA   SQL   FLUTTER
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.90;.96" dur="8s" fill="freeze"/>
  </text>
</g>

<text x="52" y="465" class="mono dim" font-size="12">mvr@github:~$ ./profile --secure</text>
<rect x="245" y="454" width="7" height="14" class="green">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>
