<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="75%">
    <stop offset="0" stop-color="#06130b"/>
    <stop offset="1" stop-color="#000000"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono{font-family:Consolas,Monaco,monospace}
    .green{fill:#36ff78}
    .white{fill:#e2ffe9}
    .dim{fill:#6e9d7c}
  </style>
</defs>

<rect width="1000" height="500" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="998" height="498" rx="18" fill="none" stroke="#36ff78" stroke-opacity=".28"/>

<!-- Terminal header -->
<rect x="25" y="22" width="950" height="38" rx="9" fill="#080d09" stroke="#183d25"/>
<circle cx="47" cy="41" r="5" fill="#ff5f56"/>
<circle cx="65" cy="41" r="5" fill="#ffbd2e"/>
<circle cx="83" cy="41" r="5" fill="#27c93f"/>
<text x="105" y="46" class="mono dim" font-size="13">mvr@github:~</text>

<!-- Falling binary: individually positioned columns, runs for 5 sec then freezes -->
<g class="mono green" font-size="17" filter="url(#glow)" opacity=".78">
  <g>
    <text x="70" y="-20">0</text><text x="70" y="-65">1</text><text x="70" y="-110">1</text><text x="70" y="-155">0</text><text x="70" y="-200">1</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 330" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="145" y="-90">1</text><text x="145" y="-135">0</text><text x="145" y="-180">1</text><text x="145" y="-225">0</text><text x="145" y="-270">0</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 380" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="220" y="-40">0</text><text x="220" y="-85">1</text><text x="220" y="-130">0</text><text x="220" y="-175">1</text><text x="220" y="-220">1</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 350" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="305" y="-140">1</text><text x="305" y="-185">1</text><text x="305" y="-230">0</text><text x="305" y="-275">1</text><text x="305" y="-320">0</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 390" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="390" y="-15">1</text><text x="390" y="-60">0</text><text x="390" y="-105">1</text><text x="390" y="-150">1</text><text x="390" y="-195">0</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 315" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="475" y="-105">0</text><text x="475" y="-150">1</text><text x="475" y="-195">1</text><text x="475" y="-240">0</text><text x="475" y="-285">1</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 365" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="560" y="-50">1</text><text x="560" y="-95">0</text><text x="560" y="-140">0</text><text x="560" y="-185">1</text><text x="560" y="-230">0</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 340" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="645" y="-155">0</text><text x="645" y="-200">1</text><text x="645" y="-245">0</text><text x="645" y="-290">1</text><text x="645" y="-335">1</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 405" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="730" y="-25">1</text><text x="730" y="-70">1</text><text x="730" y="-115">0</text><text x="730" y="-160">1</text><text x="730" y="-205">0</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 325" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="815" y="-115">0</text><text x="815" y="-160">1</text><text x="815" y="-205">1</text><text x="815" y="-250">0</text><text x="815" y="-295">1</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 375" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="900" y="-45">1</text><text x="900" y="-90">0</text><text x="900" y="-135">1</text><text x="900" y="-180">0</text><text x="900" y="-225">1</text>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 345" dur="5s" repeatCount="indefinite"/>
  </g>
</g>

<!-- dark overlay gradually clears after binary intro -->
<rect x="35" y="72" width="930" height="405" rx="12" fill="#000" opacity=".93">
  <animate attributeName="opacity" values=".93;.93;.93;0" keyTimes="0;.45;.55;1" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- Content begins after 5 seconds -->
<g class="mono">
  <!-- NAME typing -->
  <text x="500" y="205" text-anchor="middle" class="green" font-size="44" font-weight="700" filter="url(#glow)">
    VIMAL RAJ M
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.50;.62" dur="8s" fill="freeze"/>
  </text>

  <!-- blinking cursor / typing feel -->
  <rect x="500" y="225" width="0" height="2" class="green">
    <animate attributeName="width" values="0;390;390" keyTimes="0;.60;1" dur="8s" fill="freeze"/>
    <animate attributeName="x" values="500;695;695" keyTimes="0;.60;1" dur="8s" fill="freeze"/>
  </rect>

  <!-- CSE CYBERSECURITY -->
  <text x="500" y="260" text-anchor="middle" class="white" font-size="21">
    CSE  //  CYBERSECURITY
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.64;.75" dur="8s" fill="freeze"/>
  </text>

  <!-- profile views -->
  <text x="500" y="310" text-anchor="middle" class="dim" font-size="15">
    PROFILE VIEWS  //  <tspan class="white">VISITORS</tspan>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.77;.86" dur="8s" fill="freeze"/>
  </text>

  <!-- core skills -->
  <text x="500" y="355" text-anchor="middle" class="dim" font-size="13">
    CORE SKILLS
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.87;.92" dur="8s" fill="freeze"/>
  </text>
  <text x="500" y="388" text-anchor="middle" class="green" font-size="17" letter-spacing="4">
    PYTHON   JAVA   SQL   FLUTTER
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.90;.96" dur="8s" fill="freeze"/>
  </text>
</g>

<text x="52" y="465" class="mono dim" font-size="12">mvr@github:~$ ./profile --secure</text>
<rect x="245" y="454" width="7" height="14" class="green">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>
